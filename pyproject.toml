[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pyroblox"
version = "2.0.0"
description = "Pull public Roblox data (users, friends, groups, games, badges, avatars) into typed models, CSV files, or pandas DataFrames for safety research."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Center on Terrorism, Extremism, and Counterterrorism (CTEC)" },
]
keywords = ["roblox", "api", "research", "trust-and-safety", "osint", "network-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.28",
  "pydantic>=2.5,<3",
  "click>=8.0",
  "pandas>=1.5",
  "pyyaml>=6.0",
  "networkx>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "types-requests", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/CTEC-MIIS/PyRoblox"
Issues = "https://github.com/CTEC-MIIS/PyRoblox/issues"
Changelog = "https://github.com/CTEC-MIIS/PyRoblox/blob/main/CHANGELOG.md"

[project.scripts]
roblox = "pyroblox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyroblox", "src/robloxwrapper"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "live: tests that call the real Roblox API (set ROBLOX_LIVE_TESTS=1 to run)",
]
